apiVersion: v1
kind: Service
metadata:
  name: remotely
  namespace: traefik-external-remotely
spec:
  type: ExternalName
  externalName: 192.168.178.40
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: remotely
  namespace: traefik-external-remotely
  annotations: 
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`remote.soniiit.net`)
      kind: Rule
      services:
        - name: remotely
          namespace: traefik-external-remotely
          port: 5000
          scheme: http
  tls:
    secretName: soniiit-net-production-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: soniiit-net-production-remotely
  namespace: traefik-external-remotely
spec:
  secretName: soniiit-net-production-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - "remote.soniiit.net"
