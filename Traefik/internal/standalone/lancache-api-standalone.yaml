apiVersion: v1
kind: Service
metadata:
  name: lancache-api
  namespace: traefik-homelab
spec:
  type: ExternalName
  externalName: 192.168.178.4
  ports:
    - port: 7301
      targetPort: 7301
      protocol: TCP
      name: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lancache-api
  namespace: traefik-homelab
  annotations: 
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`lancache-api.home.soniiit.net`)
      kind: Rule
      services:
        - name: lancache-api
          namespace: traefik-homelab
          port: 7301
          scheme: http
  tls:
    secretName: home-soniiit-net-selfsigned-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-soniiit-net-selfsigned-lancache-api
  namespace: traefik-homelab
spec:
  secretName: home-soniiit-net-selfsigned-tls
  issuerRef:
    name: selfsigned-issuer-home
    kind: ClusterIssuer
  dnsNames:
    - "lancache-api.home.soniiit.net"
