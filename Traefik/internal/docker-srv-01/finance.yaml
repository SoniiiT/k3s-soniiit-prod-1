apiVersion: v1
kind: Service
metadata:
  name: finance-docker
  namespace: traefik-homelab
spec:
  type: ExternalName
  externalName: 192.168.178.40
  ports:
    - port: 5006
      targetPort: 5006
      protocol: TCP
      name: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: finance-docker
  namespace: traefik-homelab
  annotations: 
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`finance.home.soniiit.net`)
      kind: Rule
      services:
        - name: finance-docker
          namespace: traefik-homelab
          port: 5006
          scheme: http
  tls:
    secretName: home-soniiit-net-selfsigned-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-soniiit-net-selfsigned-finance-docker
  namespace: traefik-homelab
spec:
  secretName: home-soniiit-net-selfsigned-tls
  issuerRef:
    name: selfsigned-issuer-home
    kind: ClusterIssuer
  dnsNames:
    - "finance.home.soniiit.net"
