  widgets:
    - resources:
        cpu: false
        memory: false
    
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          hourCycle: h23
    
    - search:
        provider: google
        target: _blank
    
    - logo:
        icon: https://2.gravatar.com/userimage/251867332/d1c6638aadab2c616ffd2581061f0711?size=600
  kubernetes:
    mode: cluster
  settings:
    title: My Awesome Homepage
    headerStyle: boxed
    
    background:
      image: https://applescoop.org/image/wallpapers/mac/purple-glowing-warm-abstract-liquid-gradient-unique-4k-hd-07-10-2024-1728360366-hd-wallpaper.jpg
      blur: md
      brightness: 50
      opacity: 70
    
    cardBlur: sm
    
    providers:
      openweathermap: openweathermapapikey
      weatherapi: weatherapiapikey
    
    quicklaunch:
        searchDescriptions: true
        hideInternetSearch: true
        hideVisitURL: true
    
    layout:
      Networking:
        icon: mdi-network-#FFFFFF
      Infrastructure and Data:
        icon: mdi-server-#FFFFFF
      Management:
        icon: mdi-auto-fix-#FFFFFF
      Monitoring:
        icon: mdi-list-status-#FFFFFF
      Services:
        icon: mdi-cog-#FFFFFF
      IoT and Smarthome:
        icon: mdi-home-#FFFFFF
      Kubernetes:
        icon: mdi-kubernetes-#FFFFFF


# The service account is necessary to allow discovery of other services
serviceAccount:
  create: true
  name: homepage

# This enables the service account to access the necessary resources
enableRbac: true
