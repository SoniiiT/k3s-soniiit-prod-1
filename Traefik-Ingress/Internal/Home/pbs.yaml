apiVersion: v1
kind: Service
metadata:
  name: pbs
  namespace: traefik-ingress
spec:
  type: ExternalName
  externalName: 192.168.178.5
  ports:
    - port: 8007
      targetPort: 8007
      protocol: TCP
      name: https
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pbs-http
  namespace: traefik-ingress
  annotations: 
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`pbs.home.soniiit.net`)
      kind: Rule
      middlewares:
        - name: pbs-redirect
          namespace: traefik-ingress
      services:
        - name: pbs
          namespace: traefik-ingress
          port: 8007
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pbs-https
  namespace: traefik-ingress
  annotations: 
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`pbs.home.soniiit.net`)
      kind: Rule
      services:
        - name: pbs
          namespace: traefik-ingress
          port: 8007
          scheme: https
  tls:
    secretName: home-soniiit-net-selfsigned-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pbs-redirect
  namespace: traefik-ingress
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-soniiit-net-selfsigned-pbs
  namespace: traefik-ingress
spec:
  secretName: home-soniiit-net-selfsigned-tls
  issuerRef:
    name: selfsigned-issuer-home
    kind: ClusterIssuer
  dnsNames:
    - "pbs.home.soniiit.net"