apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: traefik-ingress
spec:
  type: ExternalName
  externalName: 192.168.178.98
  ports:
    - port: 7878
      targetPort: 7878
      protocol: TCP
      name: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radarr-http
  namespace: traefik-ingress
  annotations: 
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`radarr.home.soniiit.net`)
      kind: Rule
      middlewares:
        - name: radarr-redirect
          namespace: traefik-ingress
      services:
        - name: radarr
          namespace: traefik-ingress
          port: 7878
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radarr-https
  namespace: traefik-ingress
  annotations: 
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`radarr.home.soniiit.net`)
      kind: Rule
      services:
        - name: radarr
          namespace: traefik-ingress
          port: 7878
          scheme: http
  tls:
    secretName: home-soniiit-net-selfsigned-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: radarr-redirect
  namespace: traefik-ingress
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-soniiit-net-selfsigned-radarr
  namespace: traefik-ingress
spec:
  secretName: home-soniiit-net-selfsigned-tls
  issuerRef:
    name: selfsigned-issuer-home
    kind: ClusterIssuer
  dnsNames:
    - "radarr.home.soniiit.net"
