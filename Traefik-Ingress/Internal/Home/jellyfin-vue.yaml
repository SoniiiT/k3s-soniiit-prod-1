apiVersion: v1
kind: Service
metadata:
  name: jellyfin-vue
  namespace: traefik-ingress
spec:
  type: ExternalName
  externalName: 192.168.178.98
  ports:
    - port: 8645
      targetPort: 8645
      protocol: TCP
      name: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin-vue-http
  namespace: traefik-ingress
  annotations: 
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`jellyfin-vue.home.soniiit.net`)
      kind: Rule
      middlewares:
        - name: jellyfin-vue-redirect
          namespace: traefik-ingress
      services:
        - name: jellyfin-vue
          namespace: traefik-ingress
          port: 8645
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin-vue-https
  namespace: traefik-ingress
  annotations: 
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`jellyfin-vue.home.soniiit.net`)
      kind: Rule
      services:
        - name: jellyfin-vue
          namespace: traefik-ingress
          port: 8645
          scheme: http
  tls:
    secretName: home-soniiit-net-selfsigned-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jellyfin-vue-redirect
  namespace: traefik-ingress
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-soniiit-net-selfsigned-jellyfin-vue
  namespace: traefik-ingress
spec:
  secretName: home-soniiit-net-selfsigned-tls
  issuerRef:
    name: selfsigned-issuer-home
    kind: ClusterIssuer
  dnsNames:
    - "jellyfin-vue.home.soniiit.net"
