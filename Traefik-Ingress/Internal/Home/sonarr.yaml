apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: traefik-ingress
spec:
  type: ExternalName
  externalName: 192.168.178.98
  ports:
    - port: 8989
      targetPort: 8989
      protocol: TCP
      name: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sonarr-http
  namespace: traefik-ingress
  annotations: 
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`sonarr.home.soniiit.net`)
      kind: Rule
      middlewares:
        - name: sonarr-redirect
          namespace: traefik-ingress
      services:
        - name: sonarr
          namespace: traefik-ingress
          port: 8989
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sonarr-https
  namespace: traefik-ingress
  annotations: 
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`sonarr.home.soniiit.net`)
      kind: Rule
      services:
        - name: sonarr
          namespace: traefik-ingress
          port: 8989
          scheme: http
  tls:
    secretName: home-soniiit-net-selfsigned-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sonarr-redirect
  namespace: traefik-ingress
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-soniiit-net-selfsigned-sonarr
  namespace: traefik-ingress
spec:
  secretName: home-soniiit-net-selfsigned-tls
  issuerRef:
    name: selfsigned-issuer-home
    kind: ClusterIssuer
  dnsNames:
    - "sonarr.home.soniiit.net"
