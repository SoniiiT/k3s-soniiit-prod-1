apiVersion: v1
kind: Service
metadata:
  name: kestra
  namespace: traefik-ingress
spec:
  type: ExternalName
  externalName: 192.168.178.30
  ports:
    - port: 1337
      targetPort: 1337
      protocol: TCP
      name: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kestra-http
  namespace: traefik-ingress
  annotations: 
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`kestra.home.soniiit.net`)
      kind: Rule
      middlewares:
        - name: kestra-redirect
          namespace: traefik-ingress
      services:
        - name: kestra
          namespace: traefik-ingress
          port: 1337
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kestra-https
  namespace: traefik-ingress
  annotations: 
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`kestra.home.soniiit.net`)
      kind: Rule
      services:
        - name: kestra
          namespace: traefik-ingress
          port: 1337
          scheme: http
  tls:
    secretName: home-soniiit-net-selfsigned-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: kestra-redirect
  namespace: traefik-ingress
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-soniiit-net-selfsigned-kestra
  namespace: traefik-ingress
spec:
  secretName: home-soniiit-net-selfsigned-tls
  issuerRef:
    name: selfsigned-issuer-home
    kind: ClusterIssuer
  dnsNames:
    - "kestra.home.soniiit.net"