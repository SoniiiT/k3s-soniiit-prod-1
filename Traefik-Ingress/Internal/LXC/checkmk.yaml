apiVersion: v1
kind: Service
metadata:
  name: checkmk
  namespace: traefik-ingress
spec:
  type: ExternalName
  externalName: 192.168.178.48
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: checkmk-http
  namespace: traefik-ingress
  annotations: 
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`checkmk.home.soniiit.net`) && PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: checkmk-redirect
          namespace: traefik-ingress
      services:
        - name: checkmk
          namespace: traefik-ingress
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: checkmk-https
  namespace: traefik-ingress
  annotations: 
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`checkmk.home.soniiit.net`) && PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: checkmk-monitoring-redirect
          namespace: traefik-ingress
      services:
        - name: checkmk
          namespace: traefik-ingress
          port: 80
  tls:
    secretName: home-soniiit-net-selfsigned-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: checkmk-redirect
  namespace: traefik-ingress
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: checkmk-monitoring-redirect
  namespace: traefik-ingress
spec:
  redirectRegex:
    regex: ^(https://checkmk.home.soniiit.net)(/)?$
    replacement: ${1}/monitoring/
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-soniiit-net-selfsigned-checkmk
  namespace: traefik-ingress
spec:
  secretName: home-soniiit-net-selfsigned-tls
  issuerRef:
    name: selfsigned-issuer-home
    kind: ClusterIssuer
  dnsNames:
    - "checkmk.home.soniiit.net"
