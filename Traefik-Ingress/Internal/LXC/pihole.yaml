apiVersion: v1
kind: Service
metadata:
  name: pihole
  namespace: traefik-ingress
spec:
  type: ExternalName
  externalName: 192.168.178.99
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pihole-http
  namespace: traefik-ingress
  annotations: 
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`pihole.home.soniiit.net`) && PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: pihole-redirect
          namespace: traefik-ingress
      services:
        - name: pihole
          namespace: traefik-ingress
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pihole-https
  namespace: traefik-ingress
  annotations: 
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`pihole.home.soniiit.net`) && PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: pihole-admin-redirect
          namespace: traefik-ingress
      services:
        - name: pihole
          namespace: traefik-ingress
          port: 80
  tls:
    secretName: home-soniiit-net-selfsigned-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pihole-redirect
  namespace: traefik-ingress
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pihole-admin-redirect
  namespace: traefik-ingress
spec:
  redirectRegex:
    regex: ^(https://pihole.home.soniiit.net)/?$
    replacement: ${1}/admin/
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-soniiit-net-selfsigned-pihole
  namespace: traefik-ingress
spec:
  secretName: home-soniiit-net-selfsigned-tls
  issuerRef:
    name: selfsigned-issuer-home
    kind: ClusterIssuer
  dnsNames:
    - "pihole.home.soniiit.net"
