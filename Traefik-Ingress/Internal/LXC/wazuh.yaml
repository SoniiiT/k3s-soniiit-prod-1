apiVersion: v1
kind: Service
metadata:
  name: wazuh
  namespace: traefik-ingress
spec:
  type: ExternalName
  externalName: 192.168.178.46
  ports:
    - port: 443
      targetPort: 443
      protocol: TCP
      name: https
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wazuh-http
  namespace: traefik-ingress
  annotations: 
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`wazuh.home.soniiit.net`)
      kind: Rule
      middlewares:
        - name: wazuh-redirect
          namespace: traefik-ingress
      services:
        - name: wazuh
          namespace: traefik-ingress
          port: 443
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wazuh-https
  namespace: traefik-ingress
  annotations: 
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`wazuh.home.soniiit.net`)
      kind: Rule
      services:
        - name: wazuh
          namespace: traefik-ingress
          port: 443
          scheme: https
  tls:
    secretName: home-soniiit-net-selfsigned-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: wazuh-redirect
  namespace: traefik-ingress
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-soniiit-net-selfsigned-wazuh
  namespace: traefik-ingress
spec:
  secretName: home-soniiit-net-selfsigned-tls
  issuerRef:
    name: selfsigned-issuer-home
    kind: ClusterIssuer
  dnsNames:
    - "wazuh.home.soniiit.net"
