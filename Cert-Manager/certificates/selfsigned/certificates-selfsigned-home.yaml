apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-soniiit-net-selfsigned
  namespace: default
spec:
  secretName: home-soniiit-net-selfsigned-tls
  issuerRef:
    name: selfsigned-issuer-home
    kind: ClusterIssuer
  dnsNames:
    - "home.soniiit.net"
    - "*.home.soniiit.net"