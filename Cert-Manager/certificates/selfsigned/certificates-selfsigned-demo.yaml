apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: demo-soniiit-net-selfsigned
  namespace: default
spec:
  secretName: demo-soniiit-net-selfsigned-tls
  issuerRef:
    name: selfsigned-issuer-demo
    kind: ClusterIssuer
  dnsNames:
    - "demo.soniiit.net"
    - "*.demo.soniiit.net"