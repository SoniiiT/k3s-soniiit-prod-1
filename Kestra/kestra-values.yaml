  ### Image
  image:
    image: kestra/kestra
    tag: latest
    pullPolicy: Always

  # extraEnv:
  #   - name: ssh-key
  #   - name: tf-id-token
  #   - name: tf-pve-api-token
  #   - name: tg-api-token
  #   - name: tsig-key

  imagePullSecrets: []
  # - name: regcred

  ### Configuration for Kestra Deployment
  ## The following 4 sections can be used to set up the Kestra configuration
  ## Please note the secrets defined here are purposely for configuration your Kestra server
  ## To use secrets in your flows, please see below under "Application Secrets"

  ### This creates a config map of the Kestra configuration
  configuration:
    kestra:
      plugins:
        configurations:
          - type:  io.kestra.plugin.scripts.runner.docker.Docker 
            values:
              volume-enabled: true
      datasources:
        postgres:
          username: kestra
          password: kestra
          url: jdbc:postgresql://kestra-postgresql:5432/kestra?connectTimeout=30&socketTimeout=30
          hikari:
            maximumPoolSize: 5
            minimumIdle: 2
            maxLifetime: 300000
            connectionTimeout: 30000
            idleTimeout: 60000
            validationTimeout: 5000
            leakDetectionThreshold: 60000

  ### This will create a Kubernetes Secret for the values provided
  ## This will be appended to kestra-secret with the key application-secrets.yml
  secrets: {}
  # Example: Store your postgres backend credentials in a secret
  #   secrets:
  #     kestra:
  #       datasources:
  #         postgres:
  #           username: pguser
  #           password: mypass123
  #           url: jdbc:postgresql://pghost:5432/db

  ### Load Kestra configuration from existing secret
  ## Here this assumes the secret is already deployed and the following apply:
  ## 1. The secret type is "Opaque"
  ## 2. The secret has a single key
  ## 3. The value of the secret is the base64 encoded Kestra configuration.
  externalSecret: {}
    #secretName: secret-name
    #key: application-kestra.yml

  ### configuration files
  ## This option allows you to reference existing local files to configure Kestra, e.g. 
  configurationPath:
  # configurationPath: /app/application.yml,/app/application-secrets.yml

  ### Kestra executable
  executable: /app/kestra


  ### Deployments
  deployments:
    webserver:
      enabled: true
      kind: Deployment
      replicaCount: 1
      command: "server webserver"
      labels: {}
      annotations: {}
      resources:
        requests:
          memory: "512Mi"
          cpu: "250m"
        limits:
          memory: "1Gi"
          cpu: "500m"
      nodeSelector: {}
      tolerations: []
      affinity: {}
      strategy: {}
      podSecurityContext: {}
      securityContext: {}
      terminationGracePeriodSeconds: 30
      extraContainers: []
      extraEnv: []
      autoscaler:
        enabled: false
        minReplicas: 1
        maxReplicas: 3
        extra: {}
        metrics: []
        #  - type: Resource
        #    resource:
        #      name: cpu
        #      target:
        #        type: Utilization
        #        averageUtilization: 50
        #  - type: Resource
        #    resource:
        #      name: memory
        #      target:
        #        type: AverageValue
        #        averageValue: 100Mi
      serviceAccountName: kestra-vault

    executor:
      enabled: true
      kind: Deployment
      command: "server executor"
      resources:
        requests:
          memory: "512Mi"
          cpu: "250m"
        limits:
          memory: "1Gi"
          cpu: "500m"
      env:
        - name: KESTRA_EXECUTOR_THREADS
          value: "4"
        - name: KESTRA_EXECUTOR_QUEUE_SIZE
          value: "100"
      serviceAccountName: kestra-vault

    indexer:
      enabled: true
      kind: Deployment
      command: "server indexer"
      resources:
        requests:
          memory: "256Mi"
          cpu: "250m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      serviceAccountName: kestra-vault

    scheduler:
      enabled: true
      kind: Deployment
      command: "server scheduler"
      resources:
        requests:
          memory: "512Mi"
          cpu: "250m"
        limits:
          memory: "1Gi"
          cpu: "500m"
      env:
        - name: KESTRA_SCHEDULER_THREADS
          value: "4"
        - name: KESTRA_SCHEDULER_QUEUE_SIZE
          value: "100"
      serviceAccountName: kestra-vault

    worker:
      enabled: true
      kind: Deployment
      command: "server worker --thread={{ .Values.deployments.worker.workerThreads }}"
      terminationGracePeriodSeconds: 60
      workerThreads: 32
      resources:
        requests:
          memory: "512Mi"
          cpu: "250m"
        limits:
          memory: "1Gi"
          cpu: "500m"
      serviceAccountName: kestra-vault

    standalone:
      enabled: false
      kind: Deployment
      command: "server standalone --worker-thread={{ .Values.deployments.standalone.workerThreads }}"
      terminationGracePeriodSeconds: 60
      workerThreads: 128

  # EE only - Define additional group of workers.
  # Must be used in addition to default workers (in standalone or separate worker deployment).
  workerGroup:
    workergroupname: # name of the worker group
      enabled: false
      kind: Deployment
      command: "server worker --thread={{ .Values.workerGroup.workergroupname.workerThreads }} --worker-group={{ .WorkerGroup }}"
      terminationGracePeriodSeconds: 60
      workerThreads: 128

  # pluginDefaults:
  #   - type: io.kestra.plugin.scripts
  #     forced: false
  #     values:
  #       taskRunner:
  #         type: io.kestra.plugin.ee.kubernetes.runner.Kubernetes
  #         pullPolicy: IfNotPresent

  # for io.kestra.core.tasks.scripts.Bash task or io.kestra.plugin.scripts.*, attach a docker dind container in order to isolate in a container
  # every command launch
  dind:
    enabled: false
    image:
      image: docker
      tag: dind
      pullPolicy: IfNotPresent
    socketPath: /var/run/docker.sock
    tmpPath: /tmp/
    resources: {}
    args:
      - --log-level=fatal
      - --group=1000
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    extraVolumeMounts: []
    extraEnv: []

  ### Kafka
  kafka:
    enabled: false
    listeners:
      client:
        protocol: PLAINTEXT
      controller:
        protocol: PLAINTEXT
      interbroker:
        protocol: PLAINTEXT
      external:
        protocol: PLAINTEXT

  ### ElasticSearch
  elasticsearch:
    enabled: false
    clusterName: "es-kestra"
    createCert: false
    protocol: http
    esConfig:
      elasticsearch.yml: |
        xpack.security.enabled: false

  ### Minio
  minio:
    enabled: true
    auth:
      rootUser: please-change-me
      rootPassword: its-not-a-secret
    defaultBuckets: kestra
    resources:
      requests:
        memory: 512Mi

  ### Postgresql
  postgresql:
    enabled: true
    auth:
      database: kestra
      username: kestra
      password: kestra
    primary:
      persistence:
        enabled: true
        size: 8Gi
      resources:
        requests:
          memory: "256Mi"
          cpu: "250m"
        limits:
          memory: "512Mi"
          cpu: "500m"

  ### Service
  service:
    type: ClusterIP
    port: 8080
    loadBalancerIP: ""
    annotations: {}
    management:
      enabled: false
      port: 8081


  ### Ingress
  ingress:
    enabled: true
    className: "traefik"
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: kestra.home.soniiit.net
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: home-soniiit-net-selfsigned-tls
        hosts:
          - kestra.home.soniiit.net


  ### Global Deployement
  nameOverride: ""
  serviceAccountName: ""


  ### Annotations for deployments
  annotations: {}
  podAnnotations: {}
  initContainers: []

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

  terminationGracePeriodSeconds: 30

  nodeSelector: {}

  tolerations: []

  affinity: {}

  extraVolumeMounts: []

  extraVolumes: []

  extraContainers: []


  # https://kestra.io/docs/administrator-guide/configuration/others#kestravariablesenv-vars-prefix
  extraConfigMapEnvFrom:
    # - name: my-existing-configmap-no-prefix
    # - name: my-existing-configmap-with-prefix
    #   prefix: KESTRA_

  extraSecretEnvFrom:
    # - name: my-existing-no-prefix
    # - name: my-existing-with-prefix
    #   prefix: SECRET_

  ### Application Secrets
  ## To pass in secrets of your applications, services etc to Kestra please see the following:
  ## https://kestra.io/docs/how-to-guides/kubernetes-secrets

  podSecurityContext: {}
  # fsGroup: 2000

  securityContext:
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000

  ### Startup / Readiness / Liveness probe config.
  ### ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-probes/
  readinessProbe:
    enabled: true
    path: /health
    port: management
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3
    httpGetEnabled: true
    httpGetExtra: {}

  livenessProbe:
    enabled: true
    path: /health
    port: management
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3
    httpGetEnabled: true
    httpGetExtra: {}

  startupProbe:
    enabled: true
    path: /health
    port: management
    initialDelaySeconds: 1
    periodSeconds: 1
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 120
    httpGetEnabled: true
    httpGetExtra: {}

  # -- Extra Kubernetes Manifests
  extraManifests:
    - apiVersion: traefik.io/v1alpha1
      kind: Middleware
      metadata:
        name: kestra-redirect
        namespace: kestra
      spec:
        redirectScheme:
          scheme: https
          permanent: true

  # Vault Integration
  extraEnv:
    - name: VAULT_ADDR
      value: "https://vault.soniiit.net"
    - name: VAULT_AUTH_METHOD
      value: "kubernetes"
    - name: VAULT_ROLE
      value: "kestra"
    - name: VAULT_PATH
      value: "kubernetes"
    - name: KESTRA_VAULT_ENABLED
      value: "true"
    - name: KESTRA_VAULT_MOUNT
      value: "kv"
    - name: KESTRA_VAULT_PREFIX
      value: "data"

  # Service Account für Vault
  serviceAccount:
    create: true
    name: kestra-vault
    annotations:
      vault.hashicorp.com/role: "kestra"