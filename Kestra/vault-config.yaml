apiVersion: v1
kind: ServiceAccount
metadata:
  name: kestra-vault
  namespace: kestra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kestra-vault
  namespace: kestra
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kestra-vault
  namespace: kestra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kestra-vault
subjects:
  - kind: ServiceAccount
    name: kestra-vault
    namespace: kestra
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kestra-vault-config
  namespace: kestra
data:
  vault-config.hcl: |
    vault {
      address = "http://vault.vault:8200"
      kubernetes_path = "kubernetes"
      kubernetes_role = "kestra"
    }
    template {
      source      = "/vault/template/kestra-secrets.ctmpl"
      destination = "/vault/secrets/kestra-secrets.yaml"
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kestra-vault-template
  namespace: kestra
data:
  kestra-secrets.ctmpl: |
    kestra:
      datasources:
        postgres:
          username: {{ with secret "kestra/postgres" }}{{ .Data.username }}{{ end }}
          password: {{ with secret "kestra/postgres" }}{{ .Data.password }}{{ end }}
          url: {{ with secret "kestra/postgres" }}{{ .Data.url }}{{ end }} 